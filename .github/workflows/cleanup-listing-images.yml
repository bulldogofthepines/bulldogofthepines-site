name: Cleanup Listing Images

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 8am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed to read commit dates

      - name: Delete images older than 22 days
        run: |
          git config user.name "BoMaMeMo Cleanup Bot"
          git config user.email "actions@github.com"

          DELETED=0
          NOW=$(date +%s)
          CUTOFF=$((22 * 86400))

          for file in listing_images/*.jpg; do
            [ -f "$file" ] || continue
            # Skip permanent assets (underscore prefix = never delete)
            [[ "$(basename $file)" == _* ]] && continue
            COMMIT_TS=$(git log -1 --format="%ct" -- "$file")
            if [ -z "$COMMIT_TS" ]; then continue; fi
            AGE=$(( NOW - COMMIT_TS ))
            if [ $AGE -gt $CUTOFF ]; then
              echo "Deleting $file (age: $(( AGE / 86400 )) days)"
              git rm "$file"
              DELETED=$((DELETED + 1))
            fi
          done

          if [ $DELETED -gt 0 ]; then
            git commit -m "Auto-cleanup: removed $DELETED listing_image(s) older than 22 days"
            git push
            echo "Removed $DELETED file(s)."
          else
            echo "Nothing to clean up."
          fi
